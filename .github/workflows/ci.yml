name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  verify:
    name: Lint, test and build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        # The build needs the variable to exist, not to be valid — no request is
        # made at build time.
        env:
          VITE_VISUAL_CROSSING_API_KEY: ci-placeholder
        run: npm run build
