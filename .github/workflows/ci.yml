name: CI

on:
  push:
    branches: ['**']
  pull_request:

# A new push makes the run it superseded pointless; cancelling it frees the
# runner and gets feedback on the current commit sooner.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # package.json declares engines.node >= 20, so both ends of that claim
        # are actually exercised rather than asserted.
        node: [20, 22]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        # The build needs the variable to exist, not to be valid — no request is
        # made at build time.
        env:
          VITE_VISUAL_CROSSING_API_KEY: ci-placeholder
        run: npm run build
